# Despliega la plantilla con los valores de ejemplo de Godot y de Unity, como dice desplegar.md (pasos 4 y 7 a 10), y
# pasa las pruebas de las guardas (tools/hooks/tests/prueba_guardas.sh, con motor falso: no hace falta ningún motor),
# la auditoría de proceso y shellcheck. En Linux, macOS (BSD date, bash de Homebrew) y Windows (Git Bash).
# Evita regresiones de la plantilla. Tarda unos minutos por combinación.
name: Prueba de la plantilla

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prueba:
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, macos-latest, windows-latest]
        motor: [godot, unity]
    steps:
      - uses: actions/checkout@v5

      - name: bash 4 o posterior (macOS trae 3.2)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          bash -c 'echo "bash $BASH_VERSION en $BASH"; (( BASH_VERSINFO[0] >= 4 ))'

      - name: Desplegar la plantilla (${{ matrix.motor }}), pasos 4 y 7 de desplegar.md
        run: |
          D="$RUNNER_TEMP/despliegue"
          mkdir -p "$D"
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} rellenar_plantilla.py \
            --valores "ejemplo_valores_${{ matrix.motor }}_pc.json" --destino "$D"
          cd "$D"
          git init -q -b main .
          git config user.name prueba && git config user.email prueba@example.invalid
          git add -- CLAUDE.md .gitignore .gitattributes .claude docs tools
          git add --chmod=+x -- $(grep -l '^#!' $(git ls-files -- tools))
          git commit -q -m "coordinador: despliegue"
          echo "DESPLIEGUE=$D" >> "$GITHUB_ENV"

      - name: Sin marcadores sin rellenar (salvo {{COMPLETAR}} de roles extra)
        working-directory: ${{ env.DESPLIEGUE }}
        run: |
          if grep -rn "{{" CLAUDE.md docs tools .claude | grep -v "{{COMPLETAR[:}]"; then
            echo "::error::Quedan marcadores sin rellenar"; exit 1
          fi

      - name: Pruebas de las guardas
        working-directory: ${{ env.DESPLIEGUE }}
        run: ./tools/hooks/tests/prueba_guardas.sh

      - name: Pasos 8 a 10 de desplegar.md (hooks, primera fila, excepción y auditoría sin hallazgos)
        working-directory: ${{ env.DESPLIEGUE }}
        run: |
          ./tools/hooks/arranque_rol.sh coordinador > /dev/null
          ./tools/hooks/entregar.sh coordinador "Despliegue inicial del sistema; primer lote A1 en el plan" \
            docs/direccion/plan_nocturno.md arquitecto-sistemas
          printf '# Commits que la comprobación 2 no revisa (hash y motivo)\n%s despliegue inicial\n' \
            "$(git rev-list --max-parents=0 HEAD)" > tools/auditoria/excepciones_proceso.txt
          ./tools/hooks/entregar.sh auditor-calidad "Excepción del commit de despliegue" tools/auditoria/excepciones_proceso.txt \
            coordinador -- tools/auditoria/excepciones_proceso.txt
          ./tools/auditoria/auditoria_proceso.sh
          if git status --short | grep -v '^?? docs/calidad/'; then echo "::error::El árbol no quedó limpio"; exit 1; fi

      - name: Los tres niveles de autonomía (Godot con bajo, medio y alto; valor inválido rechazado)
        if: runner.os == 'Linux' && matrix.motor == 'godot'
        run: |
          # nivel <nivel> <json>: valores de ejemplo de Godot con otro NIVEL_AUTONOMIA
          nivel() { python3 -c 'import json, sys; v = json.load(open("ejemplo_valores_godot_pc.json")); v["NIVEL_AUTONOMIA"] = sys.argv[1]; json.dump(v, open(sys.argv[2], "w"))' "$1" "$2"; }
          for N in bajo medio alto; do
            echo "== Nivel $N"
            nivel "$N" "$RUNNER_TEMP/valores_$N.json"
            D="$RUNNER_TEMP/nivel_$N" P="$RUNNER_TEMP/puerta_$N.txt"
            python3 rellenar_plantilla.py --valores "$RUNNER_TEMP/valores_$N.json" --destino "$D" > /dev/null
            cd "$D"
            git init -q -b main .
            git config user.name prueba && git config user.email prueba@example.invalid
            git add -- CLAUDE.md .gitignore .gitattributes .claude docs tools
            git add --chmod=+x -- $(grep -l '^#!' $(git ls-files -- tools))
            git commit -q -m "coordinador: despliegue"
            if grep -rn "{{" CLAUDE.md docs tools .claude | grep -v "{{COMPLETAR[:}]"; then
              echo "::error::[$N] Quedan marcadores sin rellenar"; exit 1
            fi
            grep -q "^## 9\. Nivel de autonomía (\`$N\`)" docs/direccion/normas_comunes.md \
              || { echo "::error::[$N] La cabecera de normas §9 no dice el nivel"; exit 1; }
            for O in bajo medio alto; do
              [[ "$O" == "$N" ]] && continue
              if grep -rn "Nivel \`$O\`" CLAUDE.md docs; then echo "::error::[$N] Aparece el texto del nivel $O"; exit 1; fi
            done
            R=0; ./tools/auditoria/preparacion_ronda.sh 1 > "$P" || R=$?
            cat "$P"
            [[ $R == 1 ]] || { echo "::error::[$N] preparacion_ronda.sh 1 salió con $R (se esperaba 1: el lote A1 lleva '...')"; exit 1; }
            grep -q "lote A1 con el comando" "$P" || { echo "::error::[$N] La puerta no señala el comando de A1"; exit 1; }
            if [[ "$N" != bajo ]] && ! grep -q "especificaciones.md" "$P"; then
              echo "::error::[$N] La puerta no nombra la especificación"; exit 1
            fi
            ./tools/hooks/arranque_rol.sh coordinador > /dev/null
            ./tools/hooks/entregar.sh coordinador "Despliegue inicial del sistema; primer lote A1 en el plan" \
              docs/direccion/plan_nocturno.md arquitecto-sistemas
            printf '# Commits que la comprobación 2 no revisa (hash y motivo)\n%s despliegue inicial\n' \
              "$(git rev-list --max-parents=0 HEAD)" > tools/auditoria/excepciones_proceso.txt
            ./tools/hooks/entregar.sh auditor-calidad "Excepción del commit de despliegue" tools/auditoria/excepciones_proceso.txt \
              coordinador -- tools/auditoria/excepciones_proceso.txt
            ./tools/auditoria/auditoria_proceso.sh
            cd "$GITHUB_WORKSPACE"
          done
          nivel altisimo "$RUNNER_TEMP/valores_mal.json"
          if python3 rellenar_plantilla.py --valores "$RUNNER_TEMP/valores_mal.json" --destino "$RUNNER_TEMP/nivel_mal"; then
            echo "::error::NIVEL_AUTONOMIA=altisimo no hizo fallar rellenar_plantilla.py"; exit 1
          fi

      - name: Un clon con core.autocrlf deja los scripts en LF (.gitattributes, Windows)
        if: runner.os == 'Windows'
        run: |
          C="$RUNNER_TEMP/clon"
          git -c core.autocrlf=true clone -q "$DESPLIEGUE" "$C"
          cd "$C"
          if grep -l $'\r' $(git ls-files -- 'tools/*.sh') tools/hooks/pre-commit tools/hooks/commit-msg; then
            echo "::error::Scripts con CRLF tras clonar: bash no los entendería"; exit 1
          fi
          grep -q $'\r' CLAUDE.md && echo "core.autocrlf activo (CLAUDE.md en CRLF) y los scripts en LF: bien"
          ./tools/hooks/fijar_rol.sh coordinador

      - name: Con bash 3.2 las guardas fallan cerradas y los avisos no bloquean (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.DESPLIEGUE }}
        run: |
          E="$RUNNER_TEMP/err.txt"
          set +e
          printf '{"session_id":"S","tool_input":{"command":"ls"}}' | /bin/bash tools/hooks/pre_tool_guard.sh 2> "$E"
          R=$?; cat "$E"
          [[ $R == 2 ]] && grep -q "bash 4" "$E" || { echo "::error::pre_tool_guard.sh no bloqueó con bash 3.2 (código $R)"; exit 1; }
          printf '{"session_id":"S","tool_input":{"file_path":"CLAUDE.md"}}' | /bin/bash tools/hooks/guard_propiedad.sh 2> "$E"
          R=$?; [[ $R == 2 ]] || { echo "::error::guard_propiedad.sh no bloqueó con bash 3.2 (código $R)"; exit 1; }
          printf '{"session_id":"S","prompt":"x"}' | /bin/bash tools/hooks/aviso_contexto.sh
          R=$?; [[ $R == 0 ]] || { echo "::error::aviso_contexto.sh bloquearía el mensaje con bash 3.2 (código $R)"; exit 1; }

      - name: shellcheck
        if: runner.os == 'Linux'
        working-directory: ${{ env.DESPLIEGUE }}
        run: shellcheck -x -S warning $(find tools -name '*.sh') tools/hooks/pre-commit tools/hooks/commit-msg
